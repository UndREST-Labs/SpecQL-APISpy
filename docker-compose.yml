version: '3.9'

# Common configuration
x-common-config: &common-config
  volumes:
    # Mount results directory to persist analysis output
    - ./results:/speql/results
    # Optional: Mount external Azure specs
    # - ./azure-rest-api-specs:/speql/azure-rest-api-specs
  command: python3 analyze.py
  # For interactive use:
  # stdin_open: true
  # tty: true
  # command: /bin/bash

x-build-args: &build-args
  # Version 2.20.2 is required - newer versions (2.23.x+) have compatibility issues with JSON-only databases
  CODEQL_VERSION: 2.20.2

services:
  # Standard x86_64/amd64 service (default)
  speql:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *build-args
    image: speql:latest
    container_name: speql
    <<: *common-config

  # ARM64 service for Raspberry Pi, Apple Silicon, etc.
  speql-arm64:
    build:
      context: .
      dockerfile: Dockerfile.arm64
      args:
        <<: *build-args
    image: speql:arm64
    container_name: speql-arm64
    <<: *common-config

