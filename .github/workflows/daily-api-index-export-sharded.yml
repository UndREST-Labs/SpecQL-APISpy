name: Daily API Index Export (Sharded)

on:
  schedule:
    # Run daily at 05:00 UTC
    - cron: '0 5 * * *'

  workflow_dispatch:
    inputs:
      spec_scope:
        description: 'Subdirectory within azure-rest-api-specs to export (default: specification)'
        required: false
        default: 'specification'

jobs:
  export-api-index-sharded:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout SpecRecon
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pyfiglet pytest

      - name: Clone / update azure-rest-api-specs
        run: |
          python3 refresh_database.py --all --skip-db-build

      - name: Run API inventory export
        run: |
          SCOPE="${{ github.event.inputs.spec_scope || 'specification' }}"
          python3 scripts/export/export_api_inventory.py \
            --source "azure-rest-api-specs/${SCOPE}" \
            --output-dir inventory/ \
            --sharded \
            --minified \
            --verbose

      - name: Run export pipeline tests
        run: |
          python3 -m pytest \
            tests/test_api_inventory_export.py \
            tests/test_api_inventory_normalization.py \
            -v

      - name: Update extension shard data
        run: |
          python3 apispy/scripts/prepare_data.py \
            --source-dir inventory/ \
            --out apispy/extension/data/

      - name: Commit updated shard data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ensure we are on the correct branch (not a detached HEAD)
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"
          git pull --rebase origin "${GITHUB_REF_NAME}"

          git add apispy/extension/data/
          if git diff --cached --quiet; then
            echo "No shard data changes to commit."
          else
            git commit -m "chore: update apispy extension shard data [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-index-sharded-${{ github.run_id }}
          path: inventory/
          retention-days: 30
